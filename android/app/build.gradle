import java.io.FileInputStream
import java.util.Properties

apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigningValue = { propertyName, envKeys ->
    def propertyValue = keystoreProperties.getProperty(propertyName)
    if (propertyValue?.trim()) {
        return propertyValue.trim()
    }

    for (def envKey : envKeys) {
        def envValue = System.getenv(envKey)
        if (envValue?.trim()) {
            return envValue.trim()
        }
    }

    return null
}

def releaseStoreFilePath = resolveSigningValue('storeFile', ['ANDROID_SIGNING_STORE_FILE', 'ANDROID_KEYSTORE_PATH'])
def releaseStorePassword = resolveSigningValue('storePassword', ['ANDROID_SIGNING_STORE_PASSWORD', 'ANDROID_KEYSTORE_PASSWORD'])
def releaseKeyAlias = resolveSigningValue('keyAlias', ['ANDROID_SIGNING_KEY_ALIAS', 'ANDROID_KEY_ALIAS'])
def releaseKeyPassword = resolveSigningValue('keyPassword', ['ANDROID_SIGNING_KEY_PASSWORD', 'ANDROID_KEY_PASSWORD'])
def hasReleaseSigningValues = [releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def releaseStoreFile = releaseStoreFilePath ? rootProject.file(releaseStoreFilePath) : null
def hasReleaseSigning = hasReleaseSigningValues && releaseStoreFile?.exists()

if (hasReleaseSigningValues && !hasReleaseSigning) {
    logger.lifecycle("Release signing config found, but keystore file is missing at ${releaseStoreFilePath}.")
}

android {
    namespace = "com.cradlyn.app"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.cradlyn.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle('Release signing is not configured. Release artifacts will be unsigned.')
            }
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
