services:
  babycore:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_BASE_URL_PROD: ${VITE_API_BASE_URL_PROD:-/api}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-30000}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_AUTH_REDIRECT_URL: ${VITE_SUPABASE_AUTH_REDIRECT_URL:-http://localhost:3000}
        VITE_PAYSTACK_PUBLIC_KEY: ${VITE_PAYSTACK_PUBLIC_KEY:-}
        VITE_PAYSTACK_LIVE_PUBLIC_KEY: ${VITE_PAYSTACK_LIVE_PUBLIC_KEY:-}
        VITE_FLUTTERWAVE_PUBLIC_KEY: ${VITE_FLUTTERWAVE_PUBLIC_KEY:-}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
        VITE_NATIVE_API_BASE_URL: ${VITE_NATIVE_API_BASE_URL:-}
        VITE_NATIVE_REMOTE_PUSH_ENABLED: ${VITE_NATIVE_REMOTE_PUSH_ENABLED:-false}
    image: cradlyn:local
    ports:
      - "${BABYCORE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_API_BASE_URL_PROD: ${VITE_API_BASE_URL_PROD:-/api}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      VITE_SUPABASE_AUTH_REDIRECT_URL: ${VITE_SUPABASE_AUTH_REDIRECT_URL:-http://localhost:3000}
      VITE_PAYSTACK_PUBLIC_KEY: ${VITE_PAYSTACK_PUBLIC_KEY:-}
      VITE_FLUTTERWAVE_PUBLIC_KEY: ${VITE_FLUTTERWAVE_PUBLIC_KEY:-}
      VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-}}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-${SMTP_PASSWORD:-}}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-${VITE_VAPID_PUBLIC_KEY:-}}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
